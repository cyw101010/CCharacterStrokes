<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#FFF3E0">
  <title>汉字笔画渐进展示</title>
  <style>
    :root {
      --bg-primary: #FFF3E0;
      --bg-secondary: #FFE0B2;
      --bg-card: #FFFBF5;
      --accent: #E65100;
      --accent-light: #FF9800;
      --text: #3E2723;
      --stroke-color: #1A1A1A;
      --grid-border: #FFCC80;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, var(--bg-primary) 0%, var(--bg-secondary) 100%);
      min-height: 100vh;
      color: var(--text);
      padding: 16px;
      padding-bottom: env(safe-area-inset-bottom, 16px);
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
      padding: 20px 16px;
      background: var(--bg-card);
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(230, 81, 0, 0.1);
    }

    .header h1 {
      font-size: 22px;
      color: var(--accent);
      margin-bottom: 8px;
    }

    .header p {
      font-size: 13px;
      color: #8D6E63;
    }

    .input-section {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .input-wrapper {
      flex: 1;
      position: relative;
    }

    #charInput {
      width: 100%;
      padding: 14px 16px;
      font-size: 18px;
      border: 2px solid var(--grid-border);
      border-radius: 12px;
      background: var(--bg-card);
      color: var(--text);
      outline: none;
      transition: border-color 0.3s;
      font-family: inherit;
    }

    #charInput:focus {
      border-color: var(--accent);
    }

    #charInput::placeholder {
      color: #BCAAA4;
    }

    #searchBtn {
      padding: 0 24px;
      font-size: 16px;
      font-weight: 600;
      color: white;
      background: linear-gradient(135deg, var(--accent-light), var(--accent));
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      font-family: inherit;
      min-width: 80px;
    }

    #searchBtn:active {
      transform: scale(0.96);
    }

    #searchBtn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #voiceBtn {
      width: 52px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      color: var(--accent);
      background: var(--bg-card);
      border: 2px solid var(--grid-border);
      border-radius: 12px;
      cursor: pointer;
      transition: transform 0.2s, background 0.2s, border-color 0.2s;
      font-family: inherit;
    }

    #voiceBtn:active {
      transform: scale(0.96);
    }

    #voiceBtn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #voiceBtn.listening {
      color: white;
      background: linear-gradient(135deg, var(--accent-light), var(--accent));
      border-color: transparent;
      animation: voicePulse 1.2s ease-in-out infinite;
    }

    @keyframes voicePulse {
      0%, 100% {
        box-shadow: 0 0 0 0 rgba(230, 81, 0, 0.45);
      }
      50% {
        box-shadow: 0 0 0 10px rgba(230, 81, 0, 0);
      }
    }

    .voice-hint {
      display: none;
      margin: -8px 4px 16px;
      font-size: 13px;
      line-height: 1.5;
      color: #8D6E63;
      text-align: center;
    }

    .voice-hint.visible {
      display: block;
    }

    .voice-candidates {
      display: none;
      margin: -6px 0 16px;
    }

    .voice-candidates.visible {
      display: flex;
    }

    .quick-char.selected {
      background: var(--accent-light);
      color: white;
    }

    .error-message {
      background: #FFEBEE;
      color: #C62828;
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 14px;
      display: none;
      margin-bottom: 16px;
    }

    .error-message.visible {
      display: block;
    }

    .strokes-section {
      background: var(--bg-card);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 4px 20px rgba(230, 81, 0, 0.08);
      display: none;
    }

    .strokes-section.visible {
      display: block;
    }

    .strokes-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .strokes-title {
      font-size: 14px;
      color: #8D6E63;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .strokes-title::before {
      content: "";
      display: inline-block;
      width: 4px;
      height: 16px;
      background: var(--accent);
      border-radius: 2px;
    }

    .strokes-info {
      font-size: 13px;
      color: var(--accent);
      font-weight: 600;
    }

    .duration-setting {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }

    .duration-label {
      font-size: 13px;
      color: #8D6E63;
      flex-shrink: 0;
    }

    #durationRange {
      flex: 1;
      height: 4px;
      border-radius: 2px;
      background: var(--bg-secondary);
      outline: none;
      -webkit-appearance: none;
      appearance: none;
      cursor: pointer;
    }

    #durationRange::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent-light), var(--accent));
      box-shadow: 0 2px 6px rgba(230, 81, 0, 0.35);
    }

    #durationRange::-moz-range-thumb {
      width: 22px;
      height: 22px;
      border: none;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent-light), var(--accent));
      box-shadow: 0 2px 6px rgba(230, 81, 0, 0.35);
    }

    .duration-value {
      font-size: 13px;
      font-weight: 600;
      color: var(--accent);
      min-width: 38px;
      text-align: right;
      flex-shrink: 0;
      font-variant-numeric: tabular-nums;
    }

    .strokes-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      margin-bottom: 16px;
    }

    .stroke-cell {
      aspect-ratio: 1;
      background: var(--bg-primary);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: visible;
      transition: transform 0.3s, box-shadow 0.3s, opacity 0.3s;
      border: 2px solid transparent;
      opacity: 0;
      transform: scale(0.9);
    }

    .stroke-cell.visible {
      opacity: 1;
      transform: scale(1);
    }

    .stroke-cell.active {
      border-color: var(--accent);
      box-shadow: 0 4px 12px rgba(230, 81, 0, 0.3);
    }

    .stroke-cell.done {
      background: var(--bg-secondary);
    }

    .stroke-cell svg {
      width: 85%;
      height: 85%;
    }

    .stroke-cell svg > path {
      fill: var(--stroke-color);
      stroke: none;
    }

    .stroke-number {
      position: absolute;
      top: -6px;
      left: -6px;
      width: 20px;
      height: 20px;
      background: var(--accent);
      color: white;
      font-size: 11px;
      font-weight: 700;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
      box-shadow: 0 2px 6px rgba(230, 81, 0, 0.3);
    }

    .strokes-controls {
      display: flex;
      gap: 10px;
      justify-content: center;
      padding-top: 8px;
      border-top: 1px solid var(--bg-secondary);
    }

    .control-btn {
      padding: 10px 24px;
      font-size: 14px;
      font-weight: 600;
      color: var(--accent);
      background: var(--bg-secondary);
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: transform 0.2s, background 0.2s;
      font-family: inherit;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .control-btn:active {
      transform: scale(0.96);
    }

    .control-btn.primary {
      color: white;
      background: linear-gradient(135deg, var(--accent-light), var(--accent));
    }

    .control-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .quick-chars {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 16px;
      justify-content: center;
    }

    .quick-char {
      padding: 8px 14px;
      background: var(--bg-secondary);
      color: var(--accent);
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: transform 0.2s, background 0.2s;
      font-family: inherit;
    }

    .quick-char:active {
      transform: scale(0.92);
      background: var(--accent-light);
      color: white;
    }

    @media (max-width: 360px) {
      .strokes-grid {
        gap: 6px;
      }

      .stroke-number {
        width: 18px;
        height: 18px;
        font-size: 10px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>汉字笔画渐进展示</h1>
      <p>输入或说出汉字，逐笔演示书写顺序</p>
    </div>

    <div class="input-section">
      <div class="input-wrapper">
        <input
          type="text"
          id="charInput"
          placeholder="输入汉字，或“树木的树”"
          autocomplete="off"
        >
      </div>
      <button id="searchBtn">演示</button>
      <button id="voiceBtn" title="语音输入" aria-label="语音输入">🎤</button>
    </div>

    <div class="voice-hint" id="voiceHint"></div>
    <div class="quick-chars voice-candidates" id="voiceCandidates"></div>

    <div class="error-message" id="errorMessage"></div>

    <div class="strokes-section" id="strokesSection">
      <div class="strokes-header">
        <div class="strokes-title">笔画分解</div>
        <div class="strokes-info" id="strokesInfo"></div>
      </div>
      <div class="duration-setting">
        <span class="duration-label">演示时长</span>
        <input type="range" id="durationRange" min="1" max="8" step="0.1" value="5" aria-label="笔画演示时长（秒）">
        <span class="duration-value" id="durationValue">5.0s</span>
      </div>
      <div class="strokes-grid" id="strokesGrid"></div>
      <div class="strokes-controls">
        <button class="control-btn primary" id="playBtn">▶ 重播</button>
        <button class="control-btn" id="resetBtn">↺ 重置</button>
      </div>
    </div>

    <div class="quick-chars" id="quickChars">
      <button class="quick-char" data-char="永">永</button>
      <button class="quick-char" data-char="中">中</button>
      <button class="quick-char" data-char="国">国</button>
      <button class="quick-char" data-char="爱">爱</button>
      <button class="quick-char" data-char="書">書</button>
      <button class="quick-char" data-char="龙">龙</button>
    </div>
  </div>

  <script>
    const CDN_BASE = 'https://cdn.jsdelivr.net/npm/hanzi-writer-data@2.0';

    const charInput = document.getElementById('charInput');
    const searchBtn = document.getElementById('searchBtn');
    const errorMessage = document.getElementById('errorMessage');
    const strokesSection = document.getElementById('strokesSection');
    const strokesGrid = document.getElementById('strokesGrid');
    const strokesInfo = document.getElementById('strokesInfo');
    const playBtn = document.getElementById('playBtn');
    const resetBtn = document.getElementById('resetBtn');
    const quickChars = document.getElementById('quickChars');
    const voiceBtn = document.getElementById('voiceBtn');
    const voiceHint = document.getElementById('voiceHint');
    const voiceCandidates = document.getElementById('voiceCandidates');
    const durationRange = document.getElementById('durationRange');
    const durationValue = document.getElementById('durationValue');

    // 演示时长设置：整体时长（秒），钳制在 1～8 秒
    const DURATION_MIN = 1;
    const DURATION_MAX = 8;
    // 现有动画节奏：每笔 800ms 动画 + 50ms 收尾 + 150ms 间隔 = 每笔 1 秒
    const BASE_STROKE_MS = 800;
    const BASE_SETTLE_MS = 50;
    const BASE_GAP_MS = 150;
    const BASE_SLOT_MS = BASE_STROKE_MS + BASE_SETTLE_MS + BASE_GAP_MS;

    let targetTotalMs = 5000;   // 首次加载后按「现有动画时长」重算
    let durationUserSet = false; // 用户手动调整过则不再自动跟随

    function clampDuration(value) {
      const n = Number(value);
      if (!Number.isFinite(n)) return DURATION_MIN;
      return Math.min(DURATION_MAX, Math.max(DURATION_MIN, n));
    }

    // 现有动画在给定笔数下的总时长
    function currentAnimationMs(totalStrokes) {
      return totalStrokes * BASE_SLOT_MS;
    }

    function syncDurationUI() {
      const seconds = targetTotalMs / 1000;
      durationRange.value = String(seconds);
      durationValue.textContent = `${seconds.toFixed(1)}s`;
    }

    // 未手动设置时，默认值跟随当前字的现有动画时长（并收敛到 1～8 秒）
    function applyDefaultDuration(totalStrokes) {
      if (durationUserSet) return;
      targetTotalMs = clampDuration(currentAnimationMs(totalStrokes) / 1000) * 1000;
      syncDurationUI();
    }

    // 把「整体时长」平均分摊到每一笔，保持原有 800:50:150 的节奏比例
    function getStrokeTiming(totalStrokes) {
      const slot = targetTotalMs / Math.max(totalStrokes, 1);
      return {
        strokeMs: Math.max(30, slot * (BASE_STROKE_MS / BASE_SLOT_MS)),
        settleMs: Math.max(0, slot * (BASE_SETTLE_MS / BASE_SLOT_MS)),
        gapMs: Math.max(0, slot * (BASE_GAP_MS / BASE_SLOT_MS))
      };
    }

    let currentCharData = null;
    let currentChar = '';
    let isPlaying = false;
    let animationTimeouts = [];
    let animationFrames = [];

    function clearAll() {
      animationTimeouts.forEach(t => clearTimeout(t));
      animationTimeouts = [];
      animationFrames.forEach(f => cancelAnimationFrame(f));
      animationFrames = [];
    }

    function showError(msg) {
      errorMessage.textContent = msg;
      errorMessage.classList.add('visible');
      setTimeout(() => errorMessage.classList.remove('visible'), 3000);
    }

    async function fetchCharData(char) {
      const url = `${CDN_BASE}/${encodeURIComponent(char)}.json`;
      const response = await fetch(url);
      if (!response.ok) {
        throw new Error('未找到该汉字的笔画数据');
      }
      return response.json();
    }

    function flipPathY(d) {
      // 将路径数据中的 Y 坐标翻转：y -> 1024 - y
      // 适用于 hanzi-writer-data 的绝对坐标命令 M L Q C Z
      const tokens = d.match(/[MLQCZmlqcz]|-?\d*\.?\d+(?:e[+-]?\d+)?/gi);
      if (!tokens) return d;
      let result = '';
      let i = 0;
      while (i < tokens.length) {
        const cmd = tokens[i++];
        result += cmd + ' ';
        if (cmd === 'Z' || cmd === 'z') continue;
        // 收集该命令的所有数字参数
        const nums = [];
        while (i < tokens.length && /[-\d.]/.test(tokens[i])) {
          nums.push(parseFloat(tokens[i++]));
        }
        // 每两个数字一组 (x, y)，翻转 y
        for (let j = 0; j < nums.length; j += 2) {
          result += nums[j] + ' ';
          if (j + 1 < nums.length) {
            result += (1024 - nums[j + 1]) + ' ';
          }
        }
      }
      return result;
    }

    // 将 median 点序列转为 SVG path：M x0 y0 L x1 y1 L x2 y2 ...
    // median 是书写轨迹中心线（来自 hanzi-writer-data 的 medians 字段），方向 = 书写方向
    function medianToPath(median) {
      if (!median || median.length === 0) return '';
      let d = `M ${median[0][0]} ${median[0][1]}`;
      for (let i = 1; i < median.length; i++) {
        d += ` L ${median[i][0]} ${median[i][1]}`;
      }
      return d;
    }

    function createStrokeSVG(strokes, medians, currentIndex) {
      const NS = 'http://www.w3.org/2000/svg';
      const cell = document.createElement('div');
      cell.className = 'stroke-cell';
      cell.dataset.index = currentIndex;

      const number = document.createElement('div');
      number.className = 'stroke-number';
      number.textContent = currentIndex + 1;
      cell.appendChild(number);

      const svg = document.createElementNS(NS, 'svg');
      svg.setAttribute('viewBox', '0 0 1024 1024');
      svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');

      // 渲染累积笔画：0 到 currentIndex 的所有笔画（Y 轴已翻转，无需 group 变换）
      for (let i = 0; i <= currentIndex; i++) {
        const flippedD = flipPathY(strokes[i]);
        const path = document.createElementNS(NS, 'path');
        path.setAttribute('d', flippedD);
        path.setAttribute('data-stroke-index', i);

        if (i === currentIndex) {
          path.classList.add('current-stroke');

          // mask 的描边路径用 median（书写中心线），而不是 fill 轮廓
          // fill 轮廓是闭合边界，方向与书写无关；median 才是真正的书写轨迹
          const medianD = medianToPath(medians && medians[i] ? medians[i] : []);
          const maskPathD = medianD ? flipPathY(medianD) : flippedD;

          const maskId = `m-${currentIndex}-${Date.now()}-${Math.random().toString(36).slice(2,7)}`;
          const mask = document.createElementNS(NS, 'mask');
          mask.setAttribute('id', maskId);
          mask.setAttribute('maskUnits', 'userSpaceOnUse');
          mask.setAttribute('maskContentUnits', 'userSpaceOnUse');
          mask.setAttribute('x', '0');
          mask.setAttribute('y', '0');
          mask.setAttribute('width', '1024');
          mask.setAttribute('height', '1024');
          mask.setAttribute('mask-type', 'alpha');

          const maskPathEl = document.createElementNS(NS, 'path');
          maskPathEl.setAttribute('d', maskPathD);
          maskPathEl.setAttribute('stroke', 'white');
          maskPathEl.setAttribute('stroke-width', '200');
          maskPathEl.setAttribute('fill', 'none');
          maskPathEl.setAttribute('stroke-linecap', 'round');
          maskPathEl.setAttribute('stroke-linejoin', 'round');
          maskPathEl.setAttribute('pathLength', '1');
          // 初始即隐藏，避免 cell 可见瞬间闪现整笔
          maskPathEl.setAttribute('stroke-dasharray', '1');
          maskPathEl.setAttribute('stroke-dashoffset', '1');
          mask.appendChild(maskPathEl);

          svg.appendChild(mask);

          path.setAttribute('mask', `url(#${maskId})`);
          path._maskPathEl = maskPathEl; // 直接引用
        }

        svg.appendChild(path);
      }
      cell.appendChild(svg);

      return cell;
    }

    function getGridColumns(totalStrokes) {
      if (totalStrokes <= 3) return totalStrokes;
      if (totalStrokes <= 5) return totalStrokes;
      return 5;
    }

    function renderStrokesGrid(strokes, medians) {
      strokesGrid.innerHTML = '';
      strokesInfo.textContent = `共 ${strokes.length} 笔`;

      const columns = getGridColumns(strokes.length);
      strokesGrid.style.gridTemplateColumns = `repeat(${columns}, 1fr)`;

      if (strokes.length <= 5) {
        strokesGrid.style.maxWidth = `${strokes.length * 70}px`;
        strokesGrid.style.margin = '0 auto';
      } else {
        strokesGrid.style.maxWidth = '';
        strokesGrid.style.margin = '';
      }

      strokes.forEach((_, index) => {
        const cell = createStrokeSVG(strokes, medians, index);
        strokesGrid.appendChild(cell);
      });

      strokesSection.classList.add('visible');
    }

    function animateStroke(index, onComplete) {
      const cells = strokesGrid.querySelectorAll('.stroke-cell');
      const timing = getStrokeTiming(cells.length);

      if (index >= cells.length) {
        isPlaying = false;
        playBtn.textContent = '▶ 重播';
        playBtn.disabled = false;
        if (onComplete) onComplete();
        return;
      }

      const currentCell = cells[index];
      const currentPath = currentCell.querySelector('.current-stroke');

      currentCell.classList.add('visible', 'active');

      if (currentPath) {
        // 用 mask 沿笔画轨迹逐步揭示填充形状
        const maskPathEl = currentPath._maskPathEl;

        const DURATION = timing.strokeMs;

        if (maskPathEl) {
          // 使用 pathLength="1" 归一化，dasharray=1，dashoffset 从 1 到 0
          maskPathEl.setAttribute('stroke-dasharray', '1');
          maskPathEl.setAttribute('stroke-dashoffset', '1');

          // 逐帧用 setAttribute 更新（比 style 更可靠地触发 SVG 重绘）
          const startTime = performance.now();

          function tick(now) {
            const elapsed = now - startTime;
            const progress = Math.min(elapsed / DURATION, 1);
            const eased = progress < 0.5
              ? 2 * progress * progress
              : 1 - Math.pow(-2 * progress + 2, 2) / 2;
            maskPathEl.setAttribute('stroke-dashoffset', (1 - eased).toFixed(4));

            if (progress < 1) {
              animationFrames.push(requestAnimationFrame(tick));
            }
          }

          // 延迟一帧确保初始 dashoffset 生效
          animationFrames.push(requestAnimationFrame(() => {
            animationFrames.push(requestAnimationFrame(tick));
          }));
        }

        // 书写完成后，移除 mask 显示完整笔画
        const timeout = setTimeout(() => {
          currentPath.removeAttribute('mask');

          currentCell.classList.remove('active');
          currentCell.classList.add('done');

          const nextTimeout = setTimeout(() => {
            animateStroke(index + 1, onComplete);
          }, timing.gapMs);
          animationTimeouts.push(nextTimeout);
        }, DURATION + timing.settleMs);
        animationTimeouts.push(timeout);
      } else {
        const timeout = setTimeout(() => {
          currentCell.classList.remove('active');
          currentCell.classList.add('done');
          animateStroke(index + 1, onComplete);
        }, timing.strokeMs + timing.settleMs);
        animationTimeouts.push(timeout);
      }
    }

    function playAnimation() {
      if (!currentCharData || isPlaying) return;
      isPlaying = true;
      playBtn.disabled = true;
      playBtn.textContent = '⏸ 演示中...';

      const cells = strokesGrid.querySelectorAll('.stroke-cell');

      cells.forEach(c => {
        c.classList.remove('visible', 'active', 'done');
        const currentPath = c.querySelector('.current-stroke');
        if (currentPath) {
          const maskEl = currentPath._maskPathEl;
          if (maskEl) {
            // 重置为隐藏初态，避免重播时闪现
            maskEl.setAttribute('stroke-dasharray', '1');
            maskEl.setAttribute('stroke-dashoffset', '1');
          }
          // 恢复 mask 属性
          if (!currentPath.hasAttribute('mask') && maskEl) {
            const mask = maskEl.parentElement;
            if (mask && mask.id) {
              currentPath.setAttribute('mask', `url(#${mask.id})`);
            }
          }
        }
      });

      clearAll();
      animateStroke(0, () => {
        playBtn.textContent = '▶ 重播';
      });
    }

    function resetAnimation() {
      clearAll();
      isPlaying = false;
      playBtn.textContent = '▶ 重播';
      playBtn.disabled = false;

      const cells = strokesGrid.querySelectorAll('.stroke-cell');
      cells.forEach(c => {
        c.classList.remove('visible', 'active', 'done');
        const currentPath = c.querySelector('.current-stroke');
        if (currentPath) {
          const maskEl = currentPath._maskPathEl;
          if (maskEl) {
            maskEl.setAttribute('stroke-dasharray', '1');
            maskEl.setAttribute('stroke-dashoffset', '1');
          }
          if (!currentPath.hasAttribute('mask') && maskEl) {
            const mask = maskEl.parentElement;
            if (mask && mask.id) {
              currentPath.setAttribute('mask', `url(#${mask.id})`);
            }
          }
        }
      });
    }

        return;
      }

      currentChar = char;
      resetAnimation();

      try {
        searchBtn.disabled = true;
        searchBtn.textContent = '加载中...';
        charInput.value = char;

        const data = await fetchCharData(char);
        currentCharData = data;

        renderStrokesGrid(data.strokes, data.medians);
        applyDefaultDuration(data.strokes.length);
        playAnimation();
      } catch (err) {
        showError(err.message || '加载失败，请重试');
        console.error(err);

        searchBtn.disabled = false;
        searchBtn.textContent = '演示';

      ['金字旁', '钅'], ['虫字旁', '虫'],
      ['竹字头', '竹'], ['日字旁', '日'],
      ['反犬旁', '犭'], ['弓字旁', '弓'],
      ['马字旁', '马'], ['车字旁', '车'],
      ['耳字旁', '耳'], ['米字旁', '米'],
      ['食字旁', '饣'], ['绞丝旁', '纟'],
      ['示字旁', '礻'], ['衣字旁', '衤'],
      ['病字头', '疒'], ['病字旁', '疒'],
      ['广字头', '广'], ['门字框', '门'],
      ['国字框', '囗'], ['心字底', '心'],
      ['四点底', '灬'], ['皿字底', '皿'],
      ['雨字头', '雨'], ['鱼字旁', '鱼'],
      ['鸟字边', '鸟'], ['贝字旁', '贝'],
      ['页字边', '页'], ['立刀旁', '刂'],
      ['双耳旁', '阝'], ['左耳旁', '阝'],
      ['右耳旁', '阝'], ['又字旁', '又'],
      ['力字旁', '力']
    ];

    let charRadicalIndex = null;
    let charPinyinIndex = null;

    function ensureRadicalIndex() {
      if (charRadicalIndex) return charRadicalIndex;
      charRadicalIndex = new Map();
      Object.keys(RADICAL_DATA).forEach(radical => {
        for (const c of RADICAL_DATA[radical]) {
          if (!charRadicalIndex.has(c)) charRadicalIndex.set(c, radical);
        }
      });
      return charRadicalIndex;
    }

    function ensurePinyinIndex() {
      if (charPinyinIndex) return charPinyinIndex;
      charPinyinIndex = new Map();
      Object.keys(PINYIN_DATA).forEach(py => {
        for (const c of PINYIN_DATA[py]) {
          if (!charPinyinIndex.has(c)) charPinyinIndex.set(c, py);
        }
      });
      return charPinyinIndex;
    }

    // 取某字读音对应的、属于指定偏旁的所有字
    function sameSoundWithRadical(char, radical) {
      const py = ensurePinyinIndex().get(char);
      const radicalChars = RADICAL_DATA[radical];
      if (!py || !radicalChars) return [];

      const sameSound = PINYIN_DATA[py] || '';
      const out = [];
      for (const c of radicalChars) {
        if (sameSound.indexOf(c) >= 0) out.push(c);
      }
      return out;
    }

    // 在一句话里找出偏旁说法（取最长匹配）
    function detectRadicalPhrase(text) {
      let best = null;
      for (const [phrase, radical] of RADICAL_PHRASES) {
        if (text.indexOf(phrase) >= 0) {
          if (!best || phrase.length > best.phrase.length) {
            best = { phrase, radical };
          }
        }
      }
      return best;
    }

    function filterByRadical(candidates, radical) {
      if (!radical || candidates.length === 0) {
        return { candidates: candidates, state: 'none' };
      }
      const index = ensureRadicalIndex();
      const matched = [];
      const unknown = [];
      const others = [];
      candidates.forEach(c => {
        const r = index.get(c);
        if (!r) unknown.push(c);
        else if (r === radical) matched.push(c);
        else others.push(c);
      });

      // 情况一：识别出来的字本身就属于该偏旁
      if (matched.length > 0) {
        return { candidates: matched.concat(unknown), state: 'matched' };
      }

      // 情况二：识别字偏旁不对（语音把「潆」听成「营/迎」）→ 按读音反查该偏旁下的同音字
      const homophones = [];
      candidates.forEach(c => {
        sameSoundWithRadical(c, radical).forEach(h => {
          if (!homophones.includes(h)) homophones.push(h);
        });
      });
      if (homophones.length > 0) {
        return { candidates: homophones, state: 'homophone' };
      }

      // 情况三：该读音下没有此偏旁的字，退回原候选
      if (unknown.length > 0) {
        return { candidates: unknown, state: 'unknown' };
      }
      return { candidates: others, state: 'miss' };
    }

    // 从口语/文本中解析目标汉字，支持同音字与偏旁消歧
    function parseCharFromText(raw) {
      const text = (raw || '').replace(/[\s\u3000，。、！？；：,.!?;:"“”'‘’（）()《》<>~～\-—_]/g, '');
      const radicalHit = detectRadicalPhrase(text);
      // 先摘掉偏旁说法本身（如「三点水」），避免把「三/点/水」当成候选字
      const working = radicalHit ? text.split(radicalHit.phrase).join('') : text;
      const chars = Array.from(working).filter(isHanzi);
      const candidates = [];
      const push = (c) => {
        if (c && isHanzi(c) && !candidates.includes(c)) candidates.push(c);
      };

      // 规则 1：取最后一个「的 / 之」后面的字（同音字消歧的主要说法）
      const deRe = /[的之]([\u4e00-\u9fff])/g;
      let m;
      let afterDe = null;
      while ((m = deRe.exec(working)) !== null) afterDe = m[1];
      if (afterDe) push(afterDe);

      // 规则 2：「X字」「X这个字」
      const ziRe = /([\u4e00-\u9fff])(?:这个)?字/g;
      let z;
      let beforeZi = null;
      while ((z = ziRe.exec(working)) !== null) beforeZi = z[1];
      if (beforeZi) push(beforeZi);

      // 规则 3：整句只有一个汉字
      if (chars.length === 1) push(chars[0]);

      // 规则 4：其余汉字作为候选（用于手动点选纠正），过滤「的/之/字」这类虚词
      const stopChars = new Set(['的', '之', '字', '这', '个', '是', '了', '啊', '呢', '吗']);
      chars.forEach(c => {
        if (!stopChars.has(c)) push(c);
      });

      return {
        candidates: candidates,
        radical: radicalHit ? radicalHit.radical : null,
        phrase: radicalHit ? radicalHit.phrase : ''
      };
    }

    function setVoiceHint(msg) {
      if (!msg) {
        voiceHint.textContent = '';
        voiceHint.classList.remove('visible');
        return;
      }
      voiceHint.textContent = msg;
      voiceHint.classList.add('visible');
    }

    function showCandidates(candidates, chosen) {
      voiceCandidates.innerHTML = '';
      if (!candidates || candidates.length <= 1) {
        voiceCandidates.classList.remove('visible');
        return;
      }
      candidates.forEach(c => {
        const btn = document.createElement('button');
        btn.className = 'quick-char' + (c === chosen ? ' selected' : '');
        btn.dataset.char = c;
        btn.textContent = c;
        voiceCandidates.appendChild(btn);
      });
      voiceCandidates.classList.add('visible');
    }

    // 合并多段识别文本（语音会有多个 alternatives），再统一按偏旁过滤
    function analyzeTexts(texts) {
      let radical = null;
      let phrase = '';
      const merged = [];

      texts.forEach(t => {
        const parsed = parseCharFromText(t);
        if (parsed.radical && !radical) {
          radical = parsed.radical;
          phrase = parsed.phrase;
        }
        parsed.candidates.forEach(c => {
          if (!merged.includes(c)) merged.push(c);
        });
      });

      const filtered = filterByRadical(merged, radical);
      return {
        candidates: filtered.candidates,
        state: filtered.state,
        radical: radical,
        phrase: phrase,
        heard: texts.length ? texts[0] : ''
      };
    }

    // 统一入口：把「文字/语音识别结果」解析成单字并走既有笔画流程
    function applyCharText(rawText, source) {
      const display = (rawText || '').trim();
      const analysis = analyzeTexts(display ? [display] : []);

      if (analysis.candidates.length === 0) {
        showError(source === 'voice' ? '没有识别到有效汉字，请再说一次' : '请输入有效的汉字');
        return;
      }

      presentAnalysis(analysis, display, source);
    }

    // 展示解析结果：偏旁过滤后仍有多字时罗列出来让用户点选
    function presentAnalysis(analysis, display, source) {
      const candidates = analysis.candidates;
      const primary = candidates[0];
      const needPick = (analysis.state === 'matched' || analysis.state === 'homophone') && candidates.length > 1;

      let hint = '';
      if (needPick) {
        hint = `「${analysis.phrase}」旁有 ${candidates.length} 个候选字，请点选`;
      } else if (analysis.state === 'homophone') {
        hint = `按「${analysis.phrase}」旁 + 读音定位到 ${primary}`;
      } else if (analysis.state === 'unknown' || analysis.state === 'miss') {
        hint = `未找到「${analysis.phrase}」旁的字，暂显示 ${primary}`;
      } else {
        const heard = source === 'voice' && analysis.heard ? analysis.heard : display;
        if (heard && heard !== primary) hint = `已解析「${heard}」→ ${primary}`;
      }

      setVoiceHint(hint);
      showCandidates(candidates, needPick ? null : primary);

      if (needPick) {
        // 不替用户挑，等点选
        return;
      }

      charInput.value = primary;
      loadCharacter(primary);
    }

    function resetVoiceBtn() {
      isListening = false;
      voiceBtn.classList.remove('listening');
      voiceBtn.textContent = '🎤';
      voiceBtn.disabled = false;
    }

    function startVoiceInput() {
      if (!SpeechRecognitionClass) {
        showError('当前浏览器不支持语音输入，可手动输入「树木的树」这类说法');
        return;
      }
      if (!window.isSecureContext) {
        showError('语音输入需在 HTTPS 或 localhost 下使用，当前地址浏览器不允许用麦克风');
        return;
      }
      if (isListening) {
        try { recognition && recognition.stop(); } catch (e) {}
        return;
      }

      try {
        recognition = new SpeechRecognitionClass();
      } catch (e) {
        showError('语音输入初始化失败');
        return;
      }

      recognition.lang = 'zh-CN';
      recognition.continuous = false;
      recognition.interimResults = true;
      recognition.maxAlternatives = 5; // 多取几个候选，便于同音字纠正

      let finalTexts = [];
      let lastHeard = '';

      recognition.onstart = () => {
        isListening = true;
        voiceBtn.classList.add('listening');
        voiceBtn.textContent = '⏹';
        voiceCandidates.classList.remove('visible');
        setVoiceHint('正在聆听…可说「三点水的潆」「木字旁的树」这类说法');
      };

      recognition.onresult = (event) => {
        let interim = '';
        for (let i = event.resultIndex; i < event.results.length; i++) {
          const result = event.results[i];
          for (let j = 0; j < result.length; j++) {
            const t = (result[j].transcript || '').trim();
            if (!t) continue;
            if (result.isFinal) finalTexts.push(t);
            else interim += t;
          }
        }
        lastHeard = interim || finalTexts[finalTexts.length - 1] || lastHeard;
        if (lastHeard) setVoiceHint(`听到「${lastHeard}」`);
      };

      recognition.onerror = (event) => {
        const map = {
          'not-allowed': '麦克风权限被拒绝，请允许浏览器使用麦克风',
          'service-not-allowed': '语音服务不可用（需 HTTPS 或已授权麦克风）',
          'no-speech': '没有听到声音，请再说一次',
          'audio-capture': '未检测到麦克风设备',
          'network': '语音识别网络异常，请重试',
          'aborted': ''
        };
        if (!(event.error in map) || map[event.error] !== '') {
          showError(map[event.error] || `语音识别失败（${event.error || '未知错误'}）`);
        }
        resetVoiceBtn();
      };

      recognition.onend = () => {
        resetVoiceBtn();
        const texts = finalTexts.length ? finalTexts : (lastHeard ? [lastHeard] : []);
        if (!texts.length) {
          setVoiceHint('');
          showError('没有听到内容，请再说一次');
          return;
        }

        // 合并所有识别候选（含同音字的多个 alternatives），再按偏旁过滤
        const analysis = analyzeTexts(texts);
        if (!analysis.candidates.length) {
          setVoiceHint('');
          showError('没有识别到汉字，请再说一次');
          return;
        }

        presentAnalysis(analysis, texts[0], 'voice');
      };

      try {
        recognition.start();
      } catch (e) {
        resetVoiceBtn();
        showError('语音输入启动失败，请重试');
      }
    }

    searchBtn.addEventListener('click', () => {
      applyCharText(charInput.value, 'text');
    });

    charInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        applyCharText(charInput.value, 'text');
      }
    });

    voiceBtn.addEventListener('click', startVoiceInput);

    voiceCandidates.addEventListener('click', (e) => {
      const target = e.target.closest('.quick-char');
      if (!target) return;
      charInput.value = target.dataset.char;
      loadCharacter(target.dataset.char);
      showCandidates([], null);
      setVoiceHint('');
    });

    playBtn.addEventListener('click', playAnimation);
    resetBtn.addEventListener('click', resetAnimation);

    // 拖动时实时显示数值，松手后按新时长重播
    durationRange.addEventListener('input', () => {
      durationValue.textContent = `${clampDuration(durationRange.value).toFixed(1)}s`;
    });

    durationRange.addEventListener('change', () => {
      const seconds = clampDuration(durationRange.value);
      durationUserSet = true;
      targetTotalMs = seconds * 1000;
      syncDurationUI();

      if (!currentCharData) return;
      clearAll();
      isPlaying = false;
      playBtn.disabled = false;
      playAnimation();
    });

    quickChars.addEventListener('click', (e) => {
      const target = e.target.closest('.quick-char');
      if (target) {
        loadCharacter(target.dataset.char);
      }
    });

    loadCharacter('永');
  </script>
</body>
</html>
